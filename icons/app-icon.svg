    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset=".6" stop-color="#7cc4ff" stop-opacity=".45"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" x2="1"><stop offset="0" stop-color="#b89cff"/><stop offset="1" stop-color="#7cc4ff"/></linearGradient>
