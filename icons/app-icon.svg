  <g fill="#fff" opacity=".7"><circle cx="92" cy="110" r="2.5"/><circle cx="420" cy="88" r="2"/><circle cx="440" cy="300" r="2.5"/><circle cx="70" cy="380" r="2"/><circle cx="380" cy="440" r="1.8"/><circle cx="150" cy="60" r="1.6"/></g>
  <circle cx="256" cy="256" r="170" fill="url(#glow)"/>
