<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1b2342">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WorldTime">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<title>WorldTime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141826; --ink2:#5d6275; --cream:#fbf9f4; --cream2:#efece5;
  --ok:#2fbf84; --okbg:rgba(47,191,132,.16);
  --mono:'DM Mono',ui-monospace,monospace; --serif:Fraunces,Georgia,serif; --sans:Outfit,system-ui,sans-serif;
  --onink:#fff; --card:#fff; --creamT:rgba(251,249,244,0); --tick:rgba(20,24,38,.28);
  --nobg:#f4ece3; --nofg:#9a6a3c; --tbar:rgba(20,24,38,.08); --okfg:#178a5c; --dangerbg:#fde8ea; --dangerfg:#c23a4f;
}
html[data-theme=dark]{
  --ink:#eef0f7; --ink2:#9aa1bd; --cream:#171c2e; --cream2:#242a40; --onink:#141826; --card:#2c3350;
  --creamT:rgba(23,28,46,0); --tick:rgba(238,240,247,.3); --okbg:rgba(47,191,132,.2);
  --nobg:rgba(240,162,75,.16); --nofg:#f2b679; --tbar:rgba(255,255,255,.08); --okfg:#5fe3a8; --dangerbg:rgba(255,90,120,.16); --dangerfg:#ff8fa3;
}
/* dark mode: the skies stay, just dimmed a little */
html[data-theme=dark] #sky, html[data-theme=dark] .pcard{box-shadow:inset 0 0 0 100vmax rgba(6,8,20,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#1b2342}
body{margin:0;min-height:100dvh;font-family:var(--sans);color:#fff;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* film grain, drawn once (cheap: no blur, no animation) */
.grain{position:relative;isolation:isolate}
.grain::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:.22;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- Intro ---------- */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#2a3566 0%,#141a33 70%);transition:opacity 1s ease, visibility 1s}
#intro.gone{opacity:0;visibility:hidden}
.intro-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:34px;text-align:center;padding:24px}
.orbwrap{position:relative;width:200px;height:200px}
.orb{position:absolute;inset:20px;border-radius:50%;background:url(vendor/earth-blue-marble.jpg) 0 0/auto 100% repeat-x;animation:spin 18s linear infinite;
  box-shadow:inset -34px -18px 50px rgba(0,0,0,.85), inset 12px 8px 30px rgba(255,255,255,.18), 0 0 70px rgba(255,170,120,.35), 0 0 140px rgba(150,130,255,.25)}
@keyframes spin{to{background-position:-640px 0}}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 70%,#ffb37a 88%,#fff 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));animation:rot 1.6s linear infinite}
.ring.r2{inset:-14px;opacity:.35;animation-duration:3.2s;animation-direction:reverse}
@keyframes rot{to{transform:rotate(1turn)}}
.made{font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.65);opacity:0;animation:up 1s .4s forwards}
.names{font-family:var(--serif);font-weight:300;font-size:38px;line-height:1.2;opacity:0;animation:up 1s .9s forwards}
.from{font-size:16px;color:rgba(255,255,255,.7);opacity:0;animation:up 1s 1.5s forwards}
.from b{color:#fff;font-weight:500}
.heart{display:inline-block;color:#ff8fae;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.loadbar{width:180px;height:2px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd0a0,#b8a6ff);transition:width .4s}

/* ---------- Page ---------- */
#sky{position:fixed;inset:0;z-index:-2}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(40px + env(safe-area-inset-bottom))}
.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.topline .mono{opacity:.8}
.acts{display:flex;gap:8px}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22)}
.ibtn svg{width:19px;height:19px}
.hero{padding:6px 6px 22px;text-shadow:0 1px 18px rgba(0,0,0,.12)}
.greet{font-family:var(--serif);font-weight:300;font-size:46px;line-height:1.02;margin:0 0 18px;letter-spacing:-.01em}
.greet .soft{opacity:.62}
.greet em{font-style:normal;font-weight:400;display:block}
.herorow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hbig{font-weight:300;font-size:68px;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ap{font-size:.36em;font-weight:400;margin-left:4px;opacity:.8;letter-spacing:0}
.hsub{margin-top:12px;opacity:.85;line-height:1.9}
.sunsvg{width:64px;height:40px;flex:none}

/* best-time card */
.best{display:flex;gap:14px;align-items:center;padding:16px 16px 16px 18px;margin:0 0 14px;border-radius:24px;background:var(--cream);color:var(--ink)}
.best .bl{flex:1;min-width:0}
.best .bl .mono{color:var(--ink2);font-size:10.5px}
.best .bt{font-size:21px;font-weight:500;margin-top:4px}
.best .bs{font-size:13px;color:var(--ink2);margin-top:2px}
.best .go{flex:none;padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--onink);font-size:13px;font-weight:500}
.best .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 5px var(--okbg)}
.best.no .dot{background:#f0a24b;box-shadow:0 0 0 5px rgba(240,162,75,.18)}

/* person sky card */
.pcard{display:block;margin:0 0 14px;padding:20px 20px 18px;border-radius:28px;color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.1)}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pc-top .mono{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-dots{display:flex;gap:5px;flex:none}
.pc-dots i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.pc-mid{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
.who{font-size:17px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.role{padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.22);font-size:11.5px;font-weight:500}
.ptime{font-weight:300;font-size:54px;line-height:1;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ptime sup{font-family:var(--mono);font-size:12px;letter-spacing:0;vertical-align:28px;margin-left:4px;opacity:.85}
.pc-rel{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;opacity:.92}
.pc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.25)}
.pc-grid label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.pc-grid b{display:block;font-weight:400;font-size:16px;margin-top:3px;white-space:nowrap}
.daybar{position:relative;height:10px;margin-top:16px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.daybar i{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.5)}
.daybar b{position:absolute;top:0;bottom:0;width:3px;border-radius:3px;background:#fff;box-shadow:0 0 10px #fff}
.daybar span{position:absolute;left:12px;top:0;line-height:22px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(20,24,38,.75);text-shadow:none}
.pc-edit{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.pc-edit svg{width:15px;height:15px}

.empty{padding:22px;border-radius:28px;background:var(--cream);color:var(--ink)}
.empty h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:6px 0 8px}
.empty p{margin:0 0 16px;color:var(--ink2);line-height:1.5}
.btn{display:block;width:100%;padding:15px 18px;border-radius:18px;background:var(--ink);color:var(--onink);font-weight:500;font-size:16px;text-align:center}
.btn.light{background:var(--cream2);color:var(--ink)}
.btn.danger{background:var(--dangerbg);color:var(--dangerfg)}
.addrow{display:block;width:100%;padding:16px;border-radius:24px;border:1.5px dashed rgba(255,255,255,.5);color:#fff;font-weight:500;margin-bottom:14px}
.foot{text-align:center;opacity:.6;margin:22px 0 0}

/* ---------- When to call ---------- */
.ibtn{position:relative}
.ibtn .bd{position:absolute;top:5px;right:5px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px rgba(255,255,255,.7);display:none}
.ibtn.live .bd{display:block}
#plan{position:fixed;inset:0;z-index:55;background:var(--cream);color:var(--ink);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#plan.on{display:block;animation:slideup .28s ease}
@keyframes slideup{from{transform:translateY(24px);opacity:0}}
.pin{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(30px + env(safe-area-inset-bottom))}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.phead h2{font-family:var(--serif);font-weight:400;font-size:34px;margin:0}
.pdone{padding:11px 20px;border-radius:999px;background:var(--ink);color:var(--onink);font-weight:500;font-size:15px}
.psub{color:var(--ink2);margin:10px 0 18px;line-height:1.8;font-size:10.5px}
.psub button{text-decoration:underline;text-underline-offset:3px;letter-spacing:inherit;text-transform:inherit;color:var(--ink)}
.phero{padding:18px;border-radius:24px;background:var(--okbg)}
.phero.no{background:var(--nobg)}
.phero>.mono{color:var(--okfg);font-size:10.5px}
.phero.no>.mono{color:var(--nofg)}
.phero .big{font-size:28px;font-weight:500;margin:6px 0 2px;line-height:1.15}
.phero .sm{color:var(--ink2);font-size:14px}
.who-list{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.wrow{display:flex;align-items:center;gap:10px;font-size:14.5px}
.wrow i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.wrow .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .t{font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap;font-size:13.5px}
.wrow .z{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--nobg);color:var(--nofg)}
.psec{margin:28px 2px 10px;color:var(--ink2);font-size:10.5px}
.wlist{display:flex;flex-direction:column;gap:8px}
.witem{padding:15px 16px;border-radius:18px;background:var(--cream2)}
.witem .top{font-weight:500;font-size:16.5px}
.witem .who-list{margin-top:10px;gap:7px}
.tl{padding:16px;border-radius:20px;background:var(--cream2);margin-bottom:10px}
.tl .day{font-weight:500;margin-bottom:12px}
.tlr{display:flex;align-items:center;gap:10px;margin:8px 0}
.tlr .n{width:62px;flex:none;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar{position:relative;flex:1;height:14px;border-radius:7px;background:var(--tbar)}
.tbar i{position:absolute;top:0;bottom:0;border-radius:7px;background:var(--c)}
.tbar b{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:#e8643c;border-radius:2px}
.tlh{display:flex;justify-content:space-between;margin:6px 0 0 72px;font-family:var(--mono);font-size:9.5px;color:var(--ink2)}
.pnote{font-size:13px;color:var(--ink2);line-height:1.55;margin:16px 2px 0}

/* ---------- Overview (all on one page) ---------- */
.ov .hero{padding-bottom:16px}
.ov .greet{font-size:34px;margin-bottom:10px}
.ov .hbig{font-size:50px}
.ovw{padding:16px 16px 14px;margin:0 0 14px;border-radius:28px;background:var(--cream);color:var(--ink)}
.ovw>.mono{color:var(--ink2);font-size:10.5px;padding:0 2px}
.ovr{display:block;cursor:pointer;padding:11px 2px 9px;border-bottom:1px solid var(--tbar)}
.ovt{display:flex;align-items:baseline;gap:9px}
.ovt i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;align-self:center}
.ovt .n{flex:1;min-width:0;font-weight:500;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovt .n span{font-weight:400;font-size:12.5px;color:var(--ink2);margin-left:6px}
.ovt .t{font-size:25px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ovt .t small{font-size:12px;margin-left:3px;color:var(--ink2);letter-spacing:0}
.ovt .t sup{font-family:var(--mono);font-size:10px;color:var(--ink2);margin-left:3px}
.ovtl{position:relative;margin-top:8px}
.ovsky{height:18px;border-radius:9px}
.ovaw{position:relative;height:5px;margin-top:3px;border-radius:3px;background:var(--tbar)}
.ovaw i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--c)}
.ovtl b{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:#e8643c;border-radius:2px}
.ovl{display:flex;justify-content:space-between;margin-top:5px;font-family:var(--mono);font-size:9.5px;color:var(--ink2)}
.ovr.all{cursor:default;border-bottom:0}
.ovr.all .n{color:var(--okfg)}

/* ---------- Sheets ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;place-items:start center;background:rgba(10,12,24,.55);padding:calc(env(safe-area-inset-top) + 16px) 16px 16px}
#modal.on{display:grid}
.sheet{width:100%;max-width:440px;max-height:calc(100dvh - 32px);overflow:auto;padding:24px 22px;border-radius:30px;background:var(--cream);color:var(--ink);display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 90px rgba(0,0,0,.35);animation:pop .25s ease}
@keyframes pop{from{transform:translateY(16px) scale(.98);opacity:0}}
.sheet h2{margin:0;font-family:var(--serif);font-weight:400;font-size:28px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding-left:2px}
.inp{width:100%;padding:14px 15px;border-radius:15px;background:var(--cream2);border:1.5px solid transparent;outline:none;font-size:16px;color:var(--ink)}
.inp:focus{border-color:var(--ink)}
select.inp{appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:8px 13px;border-radius:999px;background:var(--cream2);font-size:13.5px;color:var(--ink2)}
.chips button.on{background:var(--ink);color:var(--onink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:15px;background:var(--cream2)}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{padding:11px 4px;border-radius:11px;color:var(--ink2);font-size:14.5px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.results{display:flex;flex-direction:column;gap:4px}
.results button{text-align:left;padding:12px 14px;border-radius:13px;background:var(--card);font-size:15px;color:var(--ink)}
.results button span{color:var(--ink2);font-size:12.5px}
.note{font-size:13px;color:var(--ink2);line-height:1.5;padding:2px}
.picked{padding:13px 15px;border-radius:15px;background:var(--okbg);font-size:15px}
.picked span{color:var(--ink2);font-size:12.5px}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-20px);opacity:0;z-index:80;padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--onink);font-size:14px;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Globe view ---------- */
#gview{position:fixed;inset:0;z-index:50;background:#05070f;display:none}
#gview.on{display:block}
#globe,#atlas{position:absolute;inset:0}
#atlas{display:none;touch-action:none}
.gbar{position:absolute;z-index:5;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 14px 30px;background:linear-gradient(#05070f 55%,rgba(5,7,15,0))}
.gviews{flex:1;display:flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.1)}
.gviews button{flex:1;padding:9px 0;border-radius:999px;font-size:13.5px;color:rgba(255,255,255,.65)}
.gviews button.on{background:rgba(255,255,255,.18);color:#fff}
.gdone{padding:11px 20px;border-radius:999px;background:#fff;color:#141826;font-weight:600;font-size:15px;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.gload{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.6)}
.mk{display:flex;align-items:center;gap:6px;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;transition:opacity .3s;white-space:nowrap}
.mk .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;color:#141826;background:var(--c);box-shadow:0 0 0 3px rgba(255,255,255,.2),0 0 18px var(--c)}
.mk .lb{padding:4px 9px;border-radius:10px;background:rgba(8,10,22,.88);border:1px solid rgba(255,255,255,.1);font-size:12px;line-height:1.2;color:#fff}
.mk .lb b{display:block;font-weight:600;font-size:12.5px}
.mk .lb span{color:#9aa1bd}
.mk.home .av{border-radius:10px}

@media (min-width:900px){
  .greet{font-size:56px}
  .hbig{font-size:80px}
}
</style>
</head>
<body>

<div id="intro" class="grain">
  <div class="intro-in">
    <div class="orbwrap"><div class="ring r2"></div><div class="ring"></div><div class="orb"></div></div>
    <div>
      <div class="made">Made with love for</div>
      <div class="names">Yurie <span class="heart">♥</span> Graeme</div>
    </div>
    <div class="from">from <b>Miki</b> and <b>Lennox</b></div>
    <div class="loadbar"><i id="loadbar"></i></div>
  </div>
</div>

<div id="sky" class="grain"></div>

<main class="wrap">
  <div class="topline">
    <span class="mono">WorldTime</span>
    <div class="acts">
      <button class="ibtn" id="bCall" aria-label="When to call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><span class="bd"></span></button>
      <button class="ibtn" id="bGlobe" aria-label="Globe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></button>
      <button class="ibtn" id="bAdd" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ibtn" id="bSet" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </div>
  <header class="hero" id="hero"></header>
  <section id="best"></section>
  <section id="list"></section>
  <div class="foot mono">Made with love · Miki &amp; Lennox</div>
</main>

<div id="plan" role="dialog" aria-label="When to call">
  <div class="pin">
    <div class="phead"><h2>When to call</h2><button class="pdone" id="pDone">Done</button></div>
    <div class="mono psub" id="pSub"></div>
    <div id="pBody"></div>
  </div>
</div>

<div id="gview">
  <div id="globe"></div><canvas id="atlas"></canvas>
  <div class="gload" id="gload">Loading the globe…</div>
  <div class="gbar">
    <div class="gviews" id="gviews"><button data-v="live" class="on">Live</button><button data-v="day">Day</button><button data-v="night">Night</button><button data-v="atlas">Map</button></div>
    <button class="gdone" id="gdone">Done</button>
  </div>
</div>

<div id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= Data ================= */
const KEY = 'wordtime.v1';
const PALETTE_F = ['#ff9ec4','#ffb38a','#e9a3ff','#ffc7dc'];
const PALETTE_M = ['#8ec5ff','#7ff0d6','#a9b4ff','#9fe6ff'];
const PALETTE_G = ['#c9b2ff','#b5ec9f','#ffcf8f','#d7c2ff'];
const ROLES = ['Daughter','Son','Grandchild','Parents','Sibling','Friend'];
const EMPTY = {home:null, members:[], awake:{from:8, to:22}, h12:true};
let S = load();
function load(){
  // a share link (#d=...) carries the whole family to another device
  if (location.hash.startsWith('#d=')) {
    try {
      const d = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
      history.replaceState(null,'',location.pathname);
      localStorage.setItem(KEY, JSON.stringify(d));
      return d;
    } catch(e) {}
  }
  // old builds stored example entries (demo:true); those are dropped
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.members && !d.demo) return d; } catch(e) {}
  return structuredClone(EMPTY);
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

/* ================= Time helpers ================= */
const fmtCache = {};
function parts(tz, d){
  const f = fmtCache[tz] || (fmtCache[tz] = new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',weekday:'short'}));
  const o = {}; for (const p of f.formatToParts(d)) o[p.type] = p.value; return o;
}
function offsetMin(tz, d=new Date()){
  const p = parts(tz, d);
  const asUTC = Date.UTC(+p.year, +p.month-1, +p.day, +p.hour, +p.minute);
  return Math.round((asUTC - Math.floor(d.getTime()/60000)*60000)/60000);
}
function localHour(tz, d){ const p = parts(tz, d); return +p.hour + (+p.minute)/60; }
// {hm:'7:44', ap:'pm'} in 12h mode, {hm:'19:44', ap:''} in 24h mode
function tparts(tz, d=new Date()){
  const p = parts(tz,d), h = +p.hour, mm = String(p.minute).padStart(2,'0');
  return S.h12 === false ? {hm:String(h).padStart(2,'0')+':'+mm, ap:''} : {hm:(h%12||12)+':'+mm, ap:h<12?'am':'pm'};
}
const hhmm = (tz, d=new Date()) => { const t = tparts(tz,d); return t.hm + (t.ap ? ' '+t.ap : ''); };
const hourLabel = h => S.h12 === false ? String(h).padStart(2,'0')+':00' : (h%12||12)+' '+(h<12?'am':'pm');
const weekday = (tz, d=new Date()) => parts(tz,d).weekday;
function dayKey(tz, d){ const p = parts(tz,d); return Date.UTC(+p.year,+p.month-1,+p.day); }
const homeTz = () => S.home ? S.home.tz : Intl.DateTimeFormat().resolvedOptions().timeZone;
function aheadText(tz, d){
  const m = offsetMin(tz, d) - offsetMin(homeTz(), d);
  if (m === 0) return 'Same time as you';
  const h = Math.floor(Math.abs(m)/60), mm = Math.abs(m)%60;
  const n = h + (mm ? ':' + String(mm).padStart(2,'0') : '');
  return `${n} ${h===1 && !mm ? 'hour' : 'hours'} ${m>0 ? 'ahead' : 'behind'}`;
}
function dayMark(tz, d){ const dd = (dayKey(tz,d) - dayKey(homeTz(),d))/864e5; return dd>0 ? '+1' : dd<0 ? '−1' : ''; }
const within = (h,f,t) => f<t ? (h>=f && h<t) : (h>=f || h<t);
const isAwake = (p, d) => within(localHour(p.tz, d), S.awake.from, S.awake.to);
const partOfDay = h => h<5 ? 'Night' : h<12 ? 'Morning' : h<17 ? 'Afternoon' : h<21 ? 'Evening' : 'Night';

/* ================= Sun ================= */
const R = Math.PI/180;
function solar(d){
  const N = (d - Date.UTC(d.getUTCFullYear(),0,0))/864e5, g = 2*Math.PI/365*(N-1);
  const decl = 0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g);
  const eot = 229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  return {decl, eot};
}
function subsolar(d=new Date()){
  const {decl, eot} = solar(d), utcMin = d.getUTCHours()*60 + d.getUTCMinutes() + d.getUTCSeconds()/60;
  return {lat: decl/R, lon: -(utcMin + eot - 720)/4};
}
// sun elevation (degrees) at a place, and whether it is before solar noon there
function sunAt(p, d){
  const {decl, eot} = solar(d), utcMin = d.getUTCHours()*60 + d.getUTCMinutes();
  let H = (utcMin + eot + 4*p.lon)/4 - 180; H = ((H % 360) + 540) % 360 - 180;
  const e = Math.asin(Math.sin(p.lat*R)*Math.sin(decl) + Math.cos(p.lat*R)*Math.cos(decl)*Math.cos(H*R))/R;
  return {e, morning: H < 0};
}
// sunrise / sunset on the person's local date; {polar} when the sun never rises or never sets
function sunTimes(p, d){
  const q = parts(p.tz, d), day0 = Date.UTC(+q.year, +q.month-1, +q.day);
  const {decl, eot} = solar(new Date(day0 + 12*3600e3));
  const noon = 720 - 4*p.lon - eot; // solar noon in UTC minutes after day0
  const c = (Math.sin(-0.833*R) - Math.sin(p.lat*R)*Math.sin(decl)) / (Math.cos(p.lat*R)*Math.cos(decl));
  if (c > 1) return {polar:'night'};
  if (c < -1) return {polar:'day'};
  const h = Math.acos(c)/R*4;
  return {rise: new Date(day0 + (noon - h)*60e3), set: new Date(day0 + (noon + h)*60e3)};
}

/* ================= Sky colours ================= */
// keyframes by sun elevation: [elevation, top, middle, bottom, glow]
const SKY_AM = [
  [-90,'#121a36','#1c2648','#2a3360','#4a4f8a'],
  [-12,'#18224a','#2a3566','#3d4680','#6a63a8'],
  [-6, '#2f3f78','#5b5f9c','#a487b4','#e7a6a8'],
  [0,  '#6b86c4','#b4b0d6','#f2c3b2','#ffcf9a'],
  [6,  '#7fb0e6','#c3dcf0','#fbe6c2','#ffe7a6'],
  [15, '#5ea9e8','#9dcdf0','#dff0f2','#fff4c4'],
  [90, '#3d93de','#78bdee','#c8e6f6','#fff8d8'],
];
const SKY_PM = [
  [-90,'#121a36','#1c2648','#2a3360','#4a4f8a'],
  [-12,'#1b1f48','#33306a','#4d3d78','#7a4f8a'],
  [-6, '#3a3570','#6a4f8a','#c0708a','#ff9a7a'],
  [0,  '#7279b4','#c993b4','#f6a37c','#ff8a4c'],
  [6,  '#8ea6dc','#e2b6b0','#fbb784','#ffa25c'],
  [15, '#5ea9e8','#a6cdee','#f2e6cc','#ffe2a0'],
  [90, '#3d93de','#78bdee','#c8e6f6','#fff8d8'],
];
const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const mix = (a,b,t) => { const A = hex(a), B = hex(b); return '#' + A.map((v,i) => Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); };
function skyColors(p, d){
  const {e, morning} = sunAt(p, d), K = morning ? SKY_AM : SKY_PM;
  let i = 0; while (i < K.length-2 && e > K[i+1][0]) i++;
  const a = K[i], b = K[i+1], t = Math.min(1, Math.max(0, (e - a[0])/(b[0]-a[0])));
  return {e, top:mix(a[1],b[1],t), mid:mix(a[2],b[2],t), bot:mix(a[3],b[3],t), glow:mix(a[4],b[4],t)};
}
const skyCSS = c => `radial-gradient(130% 75% at 50% 112%, ${c.glow} 0%, ${c.glow}00 62%), linear-gradient(180deg, ${c.top} 0%, ${c.mid} 58%, ${c.bot} 100%)`;
function sunIcon(e){
  const s = 'fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"';
  const ray = (cx, cy, a, r1, r2) => { const c = Math.cos(a*R), n = Math.sin(a*R); return `<path d="M${(cx+c*r1).toFixed(1)} ${(cy+n*r1).toFixed(1)}L${(cx+c*r2).toFixed(1)} ${(cy+n*r2).toFixed(1)}"/>`; };
  if (e > 8) return `<svg class="sunsvg" viewBox="0 0 64 40" ${s}><circle cx="32" cy="20" r="8"/>${[0,45,90,135,180,225,270,315].map(a => ray(32,20,a,12,16)).join('')}</svg>`;
  if (e > -8) return `<svg class="sunsvg" viewBox="0 0 64 40" ${s}><path d="M20 30a12 12 0 0 1 24 0"/>${[-160,-135,-110,-90,-70,-45,-20].map(a => ray(32,30,a,16,a===-90?25:21)).join('')}<path d="M8 30h48M18 35h28M26 39h12" opacity=".8"/></svg>`;
  return `<svg class="sunsvg" viewBox="0 0 64 40" ${s}><path d="M36 8a12 12 0 1 0 8 20a10 10 0 0 1-8-20z"/><path d="M50 9v4M48 11h4M15 26v3M13.5 27.5h3" opacity=".8"/></svg>`;
}

/* ================= People ================= */
function km(a,b){
  const x = Math.sin((b.lat-a.lat)*R/2)**2 + Math.cos(a.lat*R)*Math.cos(b.lat*R)*Math.sin((b.lon-a.lon)*R/2)**2;
  return Math.round(2*6371*Math.asin(Math.sqrt(x)));
}
const flag = cc => cc ? cc.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt())) : '';
const fmtKm = n => n.toLocaleString('en-US') + ' km';
const regionName = (() => { try { const dn = new Intl.DisplayNames(['en'],{type:'region'}); return cc => { try { return cc ? dn.of(cc.toUpperCase()) : ''; } catch(e) { return ''; } }; } catch(e) { return () => ''; } })();
const place = p => [p.city, p.country && p.country !== p.city ? p.country : ''].filter(Boolean).join(' · ');
function colorOf(m){
  const pal = m.gender==='m' ? PALETTE_M : m.gender==='g' ? PALETTE_G : PALETTE_F;
  const idx = S.members.filter(x=>x.gender===m.gender).indexOf(m);
  return pal[Math.max(0,idx) % pal.length];
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial = n => esc((n||'?').trim().charAt(0).toUpperCase());
function people(){ return S.home ? [{...S.home, isHome:true, id:'home'}, ...S.members] : [...S.members]; }
function awayText(m, d){
  if (!m.role) return fmtKm(d) + ' away';
  const r = m.role.toLowerCase(), plural = /[^s]s$/.test(r) || /\b(and|&)\b/.test(r);
  return `Your ${esc(r)} ${plural ? 'are' : 'is'} ${fmtKm(d)} away`;
}

/* ================= Call windows ================= */
const STEP = 15*60e3, SPAN = 48;
let T0 = Math.floor(Date.now()/STEP)*STEP;   // start of the 48 h look-ahead
function callWindows(){
  const ps = people(), out = []; let cur = null, best = {n:-1};
  for (let i=0;i<SPAN*4;i++){
    const t = new Date(T0 + i*STEP), awake = ps.filter(p => isAwake(p,t)).length;
    if (awake > best.n) best = {n:awake, t};
    if (awake === ps.length){ if (!cur) cur = {s:t}; cur.e = new Date(t.getTime()+STEP); }
    else if (cur){ out.push(cur); cur = null; }
  }
  if (cur) out.push(cur);
  return {wins: out, best};
}
function whenLabel(d){
  const tz = homeTz(), dd = (dayKey(tz,d) - dayKey(tz,new Date()))/864e5;
  if (dd === 0) return localHour(tz, d) >= 17 ? 'Tonight' : 'Today';
  return dd === 1 ? 'Tomorrow' : weekday(tz,d);
}

/* ================= Render ================= */
const $ = s => document.querySelector(s);
const now = () => new Date();
// only touch the DOM when the markup really changed: keeps taps from landing on replaced elements
function setHTML(sel, html){ const el = $(sel); if (el._h !== html) { el.innerHTML = html; el._h = html; } }
function render(){
  const d = now(), h = S.home;
  // the page sky follows home (or roughly the device's own place before home is set)
  const ref = h || {lat:20, lon:-new Date().getTimezoneOffset()/4, tz:homeTz()};
  const c = skyColors(ref, d);
  $('#sky').style.background = skyCSS(c);
  document.querySelector('meta[name=theme-color]').content = c.top;
  if (!h) {
    setHTML('#hero', `<h1 class="greet"><span class="soft">Welcome to</span><em>WorldTime</em></h1>`);
    setHTML('#best', '');
    setHTML('#list', `<div class="empty"><span class="mono" style="color:var(--ink2)">Step 1</span><h2>Where do you live?</h2>
      <p>Start with your home. Then add your children: their time, their sky and the best time to call appear automatically.</p>
      <button class="btn" data-edit="home">Set your home</button></div>`);
    return;
  }
  const hp = tparts(h.tz, d), hl = localHour(h.tz, d), st = sunTimes(h, d);
  const greet = hl < 5 || hl >= 22 ? 'Good Night' : hl < 12 ? 'Good Morning' : hl < 17 ? 'Good Afternoon' : 'Good Evening';
  setHTML('#hero', `
    <h1 class="greet"><span class="soft">${greet}</span><em>${esc(h.name)}</em></h1>
    <div class="herorow"><div class="hbig">${hp.hm}<span class="ap">${hp.ap}</span></div>${sunIcon(c.e)}</div>
    <div class="hsub mono">${esc(place(h))} · ${new Intl.DateTimeFormat('en-GB',{timeZone:h.tz,weekday:'short',day:'numeric',month:'short'}).format(d)}<br>${sunLine(h, st)}</div>
    <button class="mono" data-edit="home" style="margin-top:12px;opacity:.75;text-decoration:underline;text-underline-offset:4px">Change home</button>`);
  const ov = S.view === 'overview' && S.members.length;
  $('main').classList.toggle('ov', !!ov);
  if (ov) setHTML('#best', ''); else renderBest();
  setHTML('#list', (ov ? overview(d) : S.members.map(m => card(m, d)).join('')) +
    `<button class="addrow" data-add>＋ Add ${S.members.length ? 'another person' : 'your first child'}</button>`);
}
// everyone on one page: local time plus a 24 h strip (6 h back, 18 h ahead) of sky and awake hours
function overview(d){
  const H = 3600e3, w0 = Math.floor(d/H)*H - 6*H, ps = people();
  const pct = t => ((t - w0)/(24*H)*100).toFixed(2) + '%';
  const strip = test => { const out = []; let a = null;
    for (let i=0;i<=96;i++){ const on = i < 96 && test(new Date(w0 + i*H/4 + H/8));
      if (on && a === null) a = i; if (!on && a !== null) { out.push([a,i]); a = null; } }
    return out.map(([a,b]) => `<i style="left:${a/96*100}%;width:${(b-a)/96*100}%"></i>`).join(''); };
  const sky = p => 'linear-gradient(90deg,' + [...Array(49)].map((_,i) => skyColors(p, new Date(w0 + i*H/2)).mid + ' ' + (i/48*100).toFixed(1) + '%').join(',') + ')';
  const short = (tz, t) => { const x = tparts(tz, t); return (x.ap ? x.hm.replace(':00','') : x.hm) + x.ap; };
  const nowMark = `<b style="left:${pct(d.getTime())}"></b>`;
  return `<div class="ovw"><div class="mono">Everyone right now</div>
    ${ps.map(p => { const tp = tparts(p.tz, d), dm = p.isHome ? '' : dayMark(p.tz, d);
      return `<div class="ovr" role="button" data-edit="${p.id}" style="--c:${dotColor(p)}">
      <div class="ovt"><i></i><span class="n">${esc(p.isHome ? 'You' : p.name)}<span>${flag(p.cc)} ${esc(p.city)} · ${weekday(p.tz, d)}</span></span>
        <span class="t">${tp.hm}<small>${tp.ap}</small>${dm ? `<sup>${dm}</sup>` : ''}</span></div>
      <div class="ovtl"><div class="ovsky" style="background:${sky(p)}"></div><div class="ovaw">${strip(t => isAwake(p, t))}</div>${nowMark}</div>
      <div class="ovl">${[0,6,12,18,24].map(h => `<span>${short(p.tz, new Date(w0 + h*H))}</span>`).join('')}</div></div>`; }).join('')}
    <div class="ovr all" style="--c:var(--ok)"><div class="ovt"><i></i><span class="n">Everyone awake</span></div>
      <div class="ovtl"><div class="ovaw">${strip(t => ps.every(p => isAwake(p, t)))}</div>${nowMark}</div></div>
    <div class="pnote" style="margin-top:8px">Sky from 6 hours ago to 18 hours ahead, in their local time. Coloured line: awake. Orange: now.</div></div>`;
}
function sunLine(p, st){
  if (st.polar) return st.polar === 'day' ? 'Sun up all day' : 'Sun down all day';
  return `Sunrise ${hhmm(p.tz, st.rise)} · Sunset ${hhmm(p.tz, st.set)}`;
}
function card(m, d){
  const c = skyColors(m, d), tp = tparts(m.tz, d), st = sunTimes(m, d), lh = localHour(m.tz, d), aw = isAwake(m, d), dm = dayMark(m.tz, d);
  const f = S.awake.from, t = S.awake.to, bars = f < t ? [[f,t]] : [[f,24],[0,t]];
  return `<article class="pcard grain" style="background:${skyCSS(c)};--c:${colorOf(m)}">
    <div class="pc-top"><span class="mono">${flag(m.cc)} ${esc(place(m))}</span><span class="pc-dots"><i></i></span></div>
    <div class="pc-mid">
      <div><div class="who">${esc(m.name)} ${m.role ? `<span class="role">${esc(m.role)}</span>` : ''}</div>
        <div class="ptime">${tp.hm}<span class="ap">${tp.ap}</span>${dm ? `<sup>${dm}</sup>` : ''}</div></div>
      ${sunIcon(c.e)}
    </div>
    <div class="pc-rel mono"><span>${aheadText(m.tz, d)}</span><span>${weekday(m.tz, d)} · ${partOfDay(lh)} · ${aw ? 'Awake' : 'Asleep'}</span></div>
    <div class="pc-grid">
      <div><label>Sunrise</label><b>${st.polar ? '–' : hhmm(m.tz, st.rise)}</b></div>
      <div><label>Sunset</label><b>${st.polar ? '–' : hhmm(m.tz, st.set)}</b></div>
      <div><label>Distance</label><b>${fmtKm(km(S.home, m))}</b></div>
    </div>
    <div class="daybar">${bars.map(([a,b]) => `<i style="left:${a/24*100}%;width:${(b-a)/24*100}%"></i>`).join('')}<b style="left:calc(${lh/24*100}% - 1.5px)"></b></div>
    <div class="pc-rel mono" style="margin-top:12px"><span>${awayText(m, km(S.home, m))}</span><button class="pc-edit" data-edit="${m.id}" aria-label="Edit ${esc(m.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></div>
  </article>`;
}
let W8 = null;
function renderBest(){
  if (!S.members.length) { setHTML('#best', ''); return; }
  const {wins, best} = W8 || (W8 = callWindows()), tz = homeTz();
  const w = wins.find(x => x.e > Date.now());
  if (w) {
    const nowIn = w.s <= Date.now();
    setHTML('#best', `<div class="best"><span class="dot"></span><div class="bl">
      <div class="mono">${nowIn ? 'Everyone is awake' : 'Next time everyone is awake'}</div>
      <div class="bt">${nowIn ? 'Right now' : whenLabel(w.s) + ', ' + hhmm(tz, w.s)}</div>
      <div class="bs">until ${hhmm(tz, w.e)} your time</div></div>
      <button class="go" data-plan>${nowIn ? 'Call' : 'Details'}</button></div>`);
  } else {
    setHTML('#best', `<div class="best no"><span class="dot"></span><div class="bl">
      <div class="mono">No time when all are awake</div>
      <div class="bt">${whenLabel(best.t)}, ${hhmm(tz, best.t)}</div>
      <div class="bs">best option: ${best.n} of ${people().length} awake</div></div>
      <button class="go" data-plan>Details</button></div>`);
  }
}

/* ================= When to call ================= */
// "7:00 – 10:00 pm" (am/pm written once when both ends share it)
function rangeText(tz, s, e){
  const a = tparts(tz, s), b = tparts(tz, e);
  return a.ap === b.ap ? `${a.hm} – ${b.hm}${b.ap ? ' ' + b.ap : ''}` : `${a.hm} ${a.ap} – ${b.hm} ${b.ap}`;

    clamp();
  }
  const toXY = p => { const mw = mapW(); return [(p.lon+180)/360*mw, (90-p.lat)/180*mw/2]; };
  function draw(){
    if (!w) return;
    const mw = mapW(), mh = mw/2;
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle = '#05070f'; ctx.fillRect(0,0,w,h);
    const src = liveURL ? composite : IMG.day;
    for (let k=-1;k<=1;k++){
      const x = -ox + k*mw; if (x > w || x + mw < 0) continue;
      if (src) ctx.drawImage(src, x, oy, mw, mh);
      for (const m of S.home ? S.members : []){
        const [hx,hy] = toXY(S.home), [mx,my] = toXY(m);
        let dx = mx - hx; if (Math.abs(dx) > mw/2) dx -= Math.sign(dx)*mw;
        const sx = x+hx, sy = oy+hy, ex = sx+dx, ey = oy+my;
        ctx.strokeStyle = colorOf(m); ctx.lineWidth = 2; ctx.setLineDash([8,6]); ctx.lineDashOffset = -performance.now()/40;
        ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo((sx+ex)/2, Math.min(sy,ey) - Math.hypot(dx, ey-sy)*0.25, ex, ey); ctx.stroke(); ctx.setLineDash([]);
      }
      for (const p of people()){
        const [px,py] = toXY(p), X = x+px, Y = oy+py, c = p.isHome ? '#ffd36b' : colorOf(p);
        ctx.fillStyle = c; ctx.beginPath(); p.isHome ? ctx.roundRect(X-13,Y-13,26,26,7) : ctx.arc(X,Y,13,0,7); ctx.fill();
        ctx.fillStyle = '#141826'; ctx.font = '600 13px Outfit'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(p.isHome ? '⌂' : (p.name||'?').charAt(0).toUpperCase(), X, Y+1);
        const label = (p.isHome ? 'Home' : p.name) + '  ' + hhmm(p.tz);
        ctx.font = '500 12px Outfit'; const tw = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(8,10,22,.82)'; ctx.beginPath(); ctx.roundRect(X+18, Y-12, tw+16, 24, 8); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText(label, X+26, Y+1);
      }
    }
  }
  function loop(){ cancelAnimationFrame(raf); if (view !== 'atlas' || !$('#gview').classList.contains('on')) return; draw(); raf = requestAnimationFrame(loop); }
  function zoomAt(f, cx, cy){ const old = mapW(); z = Math.min(10, Math.max(1, z*f)); const k = mapW()/old; ox = (ox + cx)*k - cx; oy = cy - (cy - oy)*k; clamp(); }
  cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.deltaY<0 ? 1.15 : 1/1.15, e.offsetX, e.offsetY); }, {passive:false});
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, {x:e.offsetX, y:e.offsetY}); });
  cv.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId), cur = {x:e.offsetX, y:e.offsetY}; pointers.set(e.pointerId, cur);
    if (pointers.size === 2){ const [a,b] = [...pointers.values()], d = Math.hypot(a.x-b.x, a.y-b.y); if (pinch) zoomAt(d/pinch, (a.x+b.x)/2, (a.y+b.y)/2); pinch = d; }
    else { ox -= cur.x - prev.x; oy += cur.y - prev.y; clamp(); }
  });
  const up = e => { pointers.delete(e.pointerId); pinch = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  return {resize, center};
})();

/* ================= Wiring ================= */
function changed(){ W8 = null; applyTheme(); tick(); refreshGlobe(); }
document.addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]'); if (ed) return openEdit(ed.dataset.edit);
  if (e.target.closest('[data-add]')) return openEdit('new');
  if (e.target.closest('[data-plan]')) return openPlan();
  if (e.target.closest('[data-settings]')) return openSettings();
});
$('#bAdd').onclick = () => openEdit(S.home ? 'new' : 'home');
$('#bSet').onclick = openSettings;
$('#bGlobe').onclick = openGlobe;
let resizeT, lastW = innerWidth;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    // the phone keyboard opening only changes the height: nothing to re-layout
    if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName) && innerWidth === lastW) return;
    lastW = innerWidth; gResize();
  }, 200);
});
// keep clocks live; move the 48 h look-ahead along every 15 minutes
function tick(){
  const t0 = Math.floor(Date.now()/STEP)*STEP;
  if (t0 !== T0) { T0 = t0; W8 = null; }
  render(); renderPlan();
  const ps = people();
  $('#bCall').classList.toggle('live', !!(S.home && S.members.length && ps.every(p => isAwake(p, new Date()))));
}
setInterval(tick, 15e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

/* ================= Theme ================= */
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const t = S.theme || 'auto';
  document.documentElement.dataset.theme = t === 'dark' || (t === 'auto' && darkMQ.matches) ? 'dark' : 'light';
}
darkMQ.addEventListener?.('change', applyTheme);
applyTheme();

/* ================= Boot ================= */
(function boot(){
  const bar = $('#loadbar'), t0 = Date.now();
  bar.style.width = '35%';
  tick();
  setTimeout(() => bar.style.width = '75%', 700);
  setTimeout(() => bar.style.width = '100%', 2200);
  setTimeout(() => { $('#intro').classList.add('gone'); if (!S.home) setTimeout(() => openEdit('home'), 700); }, Math.max(0, 3400 - (Date.now() - t0)));
})();
</script>
